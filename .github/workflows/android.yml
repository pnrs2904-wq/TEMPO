# Builds and tests the Android app.
#   Every push / PR: unit tests, lint, debug APK.
#   Manual run (workflow_dispatch) or a v* tag: also release APK + AAB, R8 mapping and SHA256SUMS.
# Release builds are signed only when all four signing secrets exist; otherwise they are unsigned
# and named so. No keystore or password is ever stored in the repository.
name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", "gradle/**", "*.gradle.kts", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", "gradle/**", "*.gradle.kts", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    env:
      TEMPO_BACKEND_URL: ${{ vars.TEMPO_BACKEND_URL }}
      # Optional overrides; the app defaults to the live backend.
      TEMPO_API_BASE_URL: ${{ vars.TEMPO_API_BASE_URL }}
      TEMPO_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: All unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Decode upload keystore
        id: keystore
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.TEMPO_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TEMPO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TEMPO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TEMPO_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets: release outputs will be UNSIGNED."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release APK and AAB
        if: steps.keystore.outcome == 'success'
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          STORE_PASSWORD: ${{ secrets.TEMPO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TEMPO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TEMPO_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect outputs and checksums
        if: always()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/tempo-4.0.0-debug.apk 2>/dev/null || echo "No debug APK was built."
          if [ -d app/build/outputs/apk/release ]; then
            suffix=$([ "${{ steps.keystore.outputs.signed }}" = "true" ] && echo "" || echo "-unsigned")
            cp app/build/outputs/apk/release/*.apk "dist/tempo-4.0.0-release${suffix}.apk"
            cp app/build/outputs/bundle/release/*.aab "dist/tempo-4.0.0-release${suffix}.aab"
            cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          fi
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
          {
            echo "## Tempo Android build"
            echo ""
            echo "Commit: ${GITHUB_SHA}  ·  versionCode: ${TEMPO_VERSION_CODE}"
            echo ""
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tempo-android-${{ github.run_number }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
